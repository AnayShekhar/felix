<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- Logged out state -->
    <div id="login-view" class="view">
      <div class="header">
        <div class="logo-mark"></div>
        <h1>Lumis</h1>
      </div>
      <p class="subtitle">Sign in to connect your accounts to Lumis on your phone.</p>

      <form id="email-form">
        <input type="email" id="email-input" placeholder="Email" required />
        <input type="password" id="password-input" placeholder="Password" required />
        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div class="divider"><span>or</span></div>

      <button id="google-signin-btn" class="btn-outline">
        <img src="icons/google-logo.svg" width="16" height="16" alt="" />
        Sign in with Google
      </button>

      <p id="login-error" class="error-text"></p>
    </div>

    <!-- Logged in state -->
    <div id="connected-view" class="view hidden">
      <div class="header-row">
        <div class="header">
          <div class="logo-mark small"></div>
          <span class="app-name">Lumis</span>
        </div>
        <button id="logout-btn" class="btn-text">Sign Out</button>
      </div>
      <p id="user-email" class="user-email"></p>

      <!-- Phone ↔ extension sync status (same tri-state as iOS Settings) -->
      <div id="sync-banner" class="sync-banner">
        <span id="sync-banner-icon" class="status-icon"></span>
        <div>
          <p id="sync-banner-title" class="sync-banner-title"></p>
          <p id="sync-banner-detail" class="sync-banner-detail"></p>
        </div>
      </div>

      <div class="section">
        <p class="section-label">Connect your accounts</p>
        <div id="services-list" class="card"></div>
      </div>

      <div class="section">
        <p class="section-label">Current site</p>
        <div class="card">
          <div class="current-site-row">
            <span id="current-site-name">—</span>
            <button id="sync-current-tab-btn" class="btn-small">Connect</button>
          </div>
        </div>
      </div>

      <p id="sync-status" class="sync-status"></p>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
