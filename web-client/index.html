<!doctype html>
<!--
  Felix Web Input Client (Phase 4)
  ================================
  A single, self-contained, build-free input layer for Felix. It is the same
  concept as the iOS app — eyes (webcam) + ears (mic) for the cloud brain —
  delivered through a browser so you can drive your computer without your phone.

  Why one file: it must run with zero tooling, opened directly as a local file
  (file://) or served by the backend at GET /web. Everything (HTML/CSS/JS) lives
  here. It uses only browser APIs: getUserMedia (camera/mic), the Web Speech API
  ("Hey Felix" wake word + transcription), fetch (POST /ingest), and WebSocket
  (/ws live results). No frameworks, no dependencies.

  Brand: dark mode only, system SF Pro stack, single amber accent.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Felix</title>
<style>
  :root {
    --bg: #0a0a0b;
    --panel: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12);
    --text: #f5f5f7;
    --dim: rgba(245,245,247,0.6);
    --accent: #ffb84d;       /* single brand accent — warm amber */
    --accent-ink: #0a0a0b;
    --green: #34c759;
    --red: #ff453a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* Camera fills the screen behind the controls. */
  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
    transform: scaleX(-1); /* mirror like a selfie cam */
  }
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.55) 0%, transparent 22%, transparent 70%, rgba(0,0,0,0.7) 100%);
  }
  .viewfinder { position: absolute; inset: 40px; pointer-events: none; }
  .viewfinder span {
    position: absolute; width: 26px; height: 26px;
    border: 3px solid rgba(255,255,255,0.35); border-radius: 2px;
  }
  .viewfinder .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .viewfinder .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .viewfinder .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .viewfinder .br { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  .layer { position: relative; z-index: 2; display: flex; flex-direction: column;
           height: 100%; padding: 16px 20px 28px; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; }
  .brand .dot-logo { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); }
  .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    background: rgba(20,20,22,0.55); backdrop-filter: blur(12px);
    border: 1px solid var(--border); font-size: 12px; font-weight: 500;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4); }
  .chip .dot.live { background: var(--green); }
  .iconbtn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(20,20,22,0.55); backdrop-filter: blur(12px);
    border: 1px solid var(--border); color: var(--text);
    font-size: 15px; cursor: pointer; display: grid; place-items: center;
  }
  .iconbtn:hover { background: rgba(40,40,44,0.7); }

  /* Bottom controls */
  .bottom { margin-top: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; }

  .status {
    display: inline-flex; align-items: center; gap: 9px; max-width: 90%;
    padding: 11px 16px; border-radius: 999px;
    background: rgba(20,20,22,0.6); backdrop-filter: blur(14px);
    border: 1px solid var(--border); font-size: 14px; font-weight: 500;
  }
  .status.hearing { border-color: rgba(255,184,77,0.6); }
  .status .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .promptbar {
    width: 100%; max-width: 520px; display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 16px;
    background: rgba(20,20,22,0.6); backdrop-filter: blur(14px);
    border: 1px solid var(--border);
  }
  .promptbar input {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--text); font-size: 15px; font-weight: 500;
    font-family: inherit;
  }
  .promptbar input::placeholder { color: var(--dim); }

  .shutter {
    width: 74px; height: 74px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.9); background: transparent;
    display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .shutter .core { width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform .08s; }
  .shutter:active .core { transform: scale(0.92); }
  .shutter:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Result toast */
  .toast {
    width: 100%; max-width: 520px; display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 20px;
    background: rgba(20,20,22,0.7); backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    animation: rise .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .toast .icn {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
    font-size: 20px; font-weight: 700;
  }
  .toast.err .icn { background: var(--red); color: #fff; }
  .toast .body { flex: 1; min-width: 0; }
  .toast .kicker { font-size: 11px; font-weight: 600; letter-spacing: .04em;
                   text-transform: uppercase; color: var(--dim); }
  .toast .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast .msg { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast a.open {
    flex: none; width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #000;
    display: grid; place-items: center; text-decoration: none; font-weight: 700;
  }

  /* Settings popover */
  .settings {
    position: absolute; top: 60px; right: 20px; z-index: 5; width: 280px;
    background: rgba(24,24,26,0.96); backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 16px; padding: 16px;
    display: none; flex-direction: column; gap: 10px;
  }
  .settings.show { display: flex; }
  .settings label { font-size: 12px; color: var(--dim); }
  .settings input {
    background: rgba(255,255,255,0.08); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 11px; color: var(--text);
    font-size: 13px; font-family: inherit; outline: none;
  }
  .settings input:focus { border-color: var(--accent); }
  .settings .save {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
    padding: 9px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .settings .hint { font-size: 11px; color: var(--dim); line-height: 1.4; }

  /* Error banner — all API errors surface in UI, never console-only. */
  .banner {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 6;
    max-width: 90%; padding: 10px 14px; border-radius: 12px;
    background: rgba(255,69,58,0.95); color: #fff; font-size: 13px; font-weight: 500;
    display: none;
  }
  .banner.show { display: block; }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 3; }
</style>
</head>
<body>
<div class="stage">
  <video id="video" autoplay playsinline muted></video>
  <div class="scrim"></div>
  <div class="viewfinder"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
  <div class="flash" id="flash"></div>

  <div class="layer">
    <div class="topbar">
      <div class="brand"><span class="dot-logo"></span> Felix</div>
      <div class="spacer"></div>
      <div class="chip"><span class="dot" id="wsDot"></span><span id="wsLabel">Offline</span></div>
      <button class="iconbtn" id="gearBtn" title="Settings">⚙</button>
    </div>

    <div class="bottom">
      <div id="toastSlot"></div>
      <div class="status" id="statusChip"><span id="micIcon">🎙️</span><span class="txt" id="statusText">Starting…</span></div>
      <div class="promptbar">
        <span style="color:var(--dim)">⌨</span>
        <input id="prompt" type="text" placeholder="turn this into notes" autocomplete="off" />
      </div>
      <button class="shutter" id="shutter" title="Capture and send"><span class="core"></span></button>
    </div>
  </div>

  <div class="settings" id="settings">
    <label for="backendInput">Backend URL</label>
    <input id="backendInput" type="text" placeholder="http://localhost:8000" />
    <button class="save" id="saveBackend">Save & reconnect</button>
    <div class="hint">Where the Felix brain is running. Defaults to this page's
      origin when served, or http://localhost:8000 from a local file.</div>
  </div>

  <div class="banner" id="banner"></div>
</div>

<script>
"use strict";
(function () {
  // ---- Config / state -----------------------------------------------------
  const LS_KEY = "felix.backendURL";
  const sessionId = "web-" + Math.random().toString(36).slice(2, 8);

  function defaultBackend() {
    if (location.protocol === "http:" || location.protocol === "https:") {
      return location.origin;
    }
    return "http://localhost:8000"; // file:// fallback
  }
  function backendURL() {
    return (localStorage.getItem(LS_KEY) || defaultBackend()).replace(/\/+$/, "");
  }

  const els = {
    video: document.getElementById("video"),
    flash: document.getElementById("flash"),
    wsDot: document.getElementById("wsDot"),
    wsLabel: document.getElementById("wsLabel"),
    statusChip: document.getElementById("statusChip"),
    statusText: document.getElementById("statusText"),
    micIcon: document.getElementById("micIcon"),
    prompt: document.getElementById("prompt"),
    shutter: document.getElementById("shutter"),
    toastSlot: document.getElementById("toastSlot"),
    gearBtn: document.getElementById("gearBtn"),
    settings: document.getElementById("settings"),
    backendInput: document.getElementById("backendInput"),
    saveBackend: document.getElementById("saveBackend"),
    banner: document.getElementById("banner"),
  };

  let stream = null;
  let voiceCommand = "";   // command captured after the wake word
  let hearing = false;     // actively transcribing a command
  let busy = false;        // a capture is in flight
  let ws = null;

  // ---- UI helpers ---------------------------------------------------------
  function showBanner(msg) {
    els.banner.textContent = msg;
    els.banner.classList.add("show");
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => els.banner.classList.remove("show"), 5000);
  }

  function effectiveCommand() {
    const typed = els.prompt.value.trim();
    return typed || voiceCommand.trim();
  }

  function refreshStatus() {
    els.shutter.disabled = busy || !effectiveCommand();
    if (busy) { els.statusText.textContent = "Felix is working…"; els.micIcon.textContent = "⏳"; return; }
    const cmd = effectiveCommand();
    if (cmd) { els.statusText.textContent = cmd; els.micIcon.textContent = "✓"; els.statusChip.classList.remove("hearing"); return; }
    if (hearing) { els.statusText.textContent = "Listening…"; els.micIcon.textContent = "🌊"; els.statusChip.classList.add("hearing"); return; }
    els.statusText.textContent = 'Say “Hey Felix” or type below';
    els.micIcon.textContent = "🎙️";
    els.statusChip.classList.remove("hearing");
  }

  const TOOL_META = {
    "notes.create_from_image": ["Apple Notes", "📝"],
    "numbers.create_spreadsheet": ["Apple Numbers", "📊"],
    "numbers.add_expense": ["Apple Numbers", "📊"],
    "slides.create_presentation": ["Google Slides", "📑"],
    "gmail.draft_email": ["Gmail", "✉️"],
    "browser.open_url": ["Chrome", "🌐"],
    "spotify.play_song": ["Spotify", "🎵"],
  };

  function showResult(d) {
    if (!d || !d.tool) return;
    const failed = d.status === "error";
    const meta = TOOL_META[d.tool] || ["Done", "✓"];
    const wrap = document.createElement("div");
    wrap.className = "toast" + (failed ? " err" : "");
    const open = d.url ? `<a class="open" href="${d.url}" target="_blank" rel="noopener">↗</a>` : "";
    wrap.innerHTML =
      `<div class="icn">${failed ? "!" : meta[1]}</div>` +
      `<div class="body">` +
        `<div class="kicker">${failed ? "Couldn’t complete" : meta[0]}</div>` +
        `<div class="title">${escapeHTML(d.title || meta[0])}</div>` +
        `<div class="msg">${escapeHTML(d.message || "")}</div>` +
      `</div>${open}`;
    els.toastSlot.innerHTML = "";
    els.toastSlot.appendChild(wrap);
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // ---- Camera + mic -------------------------------------------------------
  async function startMedia() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1920 } },
        audio: false, // mic is handled by the Web Speech API, not getUserMedia
      });
      els.video.srcObject = stream;
    } catch (e) {
      showBanner("Camera unavailable: " + e.message + " (a secure context — https or localhost — is required).");
    }
  }

  function captureFrame() {
    const v = els.video;
    if (!v.videoWidth) return "";
    const canvas = document.createElement("canvas");
    canvas.width = v.videoWidth; canvas.height = v.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(v, 0, 0);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
    return dataUrl.split(",", 2)[1] || ""; // strip the data: prefix -> pure base64
  }

  // ---- "Hey Felix" wake word (Web Speech API) -----------------------------
  const WAKE_VARIANTS = ["hey felix", "hey felics", "hey phoenix", "hey felix", "a felix", "hey felux"];

  function setupSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      showBanner("This browser has no Web Speech API. Use the text box, or open in Chrome/Edge.");
      return;
    }
    const rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = "en-US";

    rec.onresult = (ev) => {
      let transcript = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        transcript += ev.results[i][0].transcript;
      }
      const lower = transcript.toLowerCase();
      const hit = WAKE_VARIANTS.map(w => lower.lastIndexOf(w)).reduce((a, b) => Math.max(a, b), -1);
      if (hit >= 0) {
        // Take whatever follows the wake word as the command.
        const after = transcript.slice(hit).replace(/^[^ ]+ [^ ]+/, "").trim();
        hearing = true;
        voiceCommand = after;
        refreshStatus();
      } else if (hearing) {
        voiceCommand = transcript.trim();
        refreshStatus();
      }
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        showBanner("Microphone permission denied — wake word disabled. You can still type.");
      }
    };
    rec.onend = () => { try { rec.start(); } catch (_) {} }; // keep it always-on
    try { rec.start(); } catch (e) { showBanner("Could not start speech recognition: " + e.message); }
  }

  // ---- Send to backend ----------------------------------------------------
  async function capture() {
    const command = effectiveCommand();
    if (busy || !command) return;
    busy = true; refreshStatus();
    els.flash.style.transition = "none"; els.flash.style.opacity = "0.85";
    requestAnimationFrame(() => { els.flash.style.transition = "opacity .3s"; els.flash.style.opacity = "0"; });

    const image = captureFrame();
    try {
      const res = await fetch(backendURL() + "/ingest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId, image, voice_text: command,
          timestamp: Date.now() / 1000,
        }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (data.steps && data.steps.length) showResult(data.steps[data.steps.length - 1]);
    } catch (e) {
      showBanner("Couldn’t reach Felix backend at " + backendURL() + " — " + e.message);
    } finally {
      busy = false;
      voiceCommand = ""; hearing = false; els.prompt.value = "";
      refreshStatus();
    }
  }

  // ---- WebSocket live results ---------------------------------------------
  function connectWS() {
    if (ws) { try { ws.close(); } catch (_) {} }
    const wsUrl = backendURL().replace(/^http/, "ws") + "/ws";
    try { ws = new WebSocket(wsUrl); }
    catch (e) { showBanner("WebSocket error: " + e.message); return; }

    ws.onopen = () => { els.wsDot.classList.add("live"); els.wsLabel.textContent = "Live"; };
    ws.onclose = () => {
      els.wsDot.classList.remove("live"); els.wsLabel.textContent = "Offline";
      setTimeout(connectWS, 2000); // auto-reconnect, like the iOS client
    };
    ws.onerror = () => { els.wsLabel.textContent = "Offline"; };
    ws.onmessage = (ev) => {
      let env; try { env = JSON.parse(ev.data); } catch (_) { return; }
      const d = env.data || {};
      if (env.event === "step_executed" || env.event === "workflow_complete") {
        if (env.event === "workflow_complete" && d.steps && d.steps.length) showResult(d.steps[d.steps.length - 1]);
        else if (d.tool) showResult(d);
      }
    };
  }

  // ---- Wire up ------------------------------------------------------------
  els.shutter.addEventListener("click", capture);
  els.prompt.addEventListener("input", refreshStatus);
  els.prompt.addEventListener("keydown", (e) => { if (e.key === "Enter") capture(); });

  els.gearBtn.addEventListener("click", () => {
    els.backendInput.value = backendURL();
    els.settings.classList.toggle("show");
  });
  els.saveBackend.addEventListener("click", () => {
    const v = els.backendInput.value.trim();
    if (v) localStorage.setItem(LS_KEY, v); else localStorage.removeItem(LS_KEY);
    els.settings.classList.remove("show");
    connectWS();
    showBanner("Backend set to " + backendURL());
  });

  startMedia();
  setupSpeech();
  connectWS();
  refreshStatus();
})();
</script>
</body>
</html>
